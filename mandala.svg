<svg width="360" height="360" viewBox="0 0 360 360" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- 外圈 -->
  <circle cx="180" cy="180" r="150"
          stroke="#7EC8FF" stroke-width="3" fill="none"/>

  <!-- 中心莲花 -->
  <path d="
    M180 110
    C160 150, 160 210, 180 250
    C200 210, 200 150, 180 110
    Z
  " stroke="#7EC8FF" stroke-width="3" fill="none"/>

  <!-- 左瓣 -->
  <path d="
    M180 180
    C130 160, 90 200, 110 240
    C130 280, 170 260, 180 230
  " stroke="#7EC8FF" stroke-width="3" fill="none"/>

  <!-- 右瓣 -->
  <path d="
    M180 180
    C230 160, 270 200, 250 240
    C230 280, 190 260, 180 230
  " stroke="#7EC8FF" stroke-width="3" fill="none"/>

  <!-- 上瓣 -->
  <path d="
    M180 140
    C160 120, 200 120, 180 140
  " stroke="#7EC8FF" stroke-width="3" fill="none"/>

  <!-- 下瓣 -->
  <path d="
    M180 220
    C160 240, 200 240, 180 220
  " stroke="#7EC8FF" stroke-width="3" fill="none"/>

  <!-- 内部圆 -->
  <circle cx="180" cy="180" r="40"
          stroke="#7EC8FF" stroke-width="2" fill="none"/>

</svg>
