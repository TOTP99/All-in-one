<svg width="420" height="420" viewBox="0 0 420 420" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- 头光 -->
  <circle cx="210" cy="120" r="70"
          stroke="#FFD700" stroke-width="3" fill="none"/>

  <!-- 面部与头部轮廓 -->
  <path d="
    M180 140
    C185 110, 235 110, 240 140
    C245 170, 215 180, 210 180
    C205 180, 175 170, 180 140
  " stroke="#FFD700" stroke-width="3" fill="none"/>

  <!-- 身体主轮廓 -->
  <path d="
    M150 180
    C130 240, 130 300, 210 330
    C290 300, 290 240, 270 180
    Z
  " stroke="#FFD700" stroke-width="3" fill="none"/>

  <!-- 衣纹细节 -->
  <path d="
    M160 200 C180 220, 240 220, 260 200
    M155 230 C180 250, 240 250, 265 230
    M170 260 C200 280, 220 280, 250 260
  " stroke="#FFD700" stroke-width="2" fill="none"/>

  <!-- 手与瓶子 -->
  <path d="
    M230 210
    C240 220, 250 240, 245 260
    C240 280, 220 280, 215 260
    C210 240, 220 220, 230 210
  " stroke="#FFD700" stroke-width="3" fill="none"/>

  <path d="
    M245 240
    C250 230, 260 230, 265 240
    C270 250, 260 260, 255 260
    C250 260, 240 250, 245 240
  " stroke="#FFD700" stroke-width="2" fill="none"/>

  <!-- 柳枝 -->
  <path d="
    M260 210
    C280 190, 300 180, 310 185
    C320 190, 315 200, 300 210
    M295 200 C305 195, 310 200, 305 205
  " stroke="#FFD700" stroke-width="2" fill="none"/>

  <!-- 岩石 -->
  <path d="
    M120 330
    C150 310, 270 310, 300 330
    C280 350, 140 350, 120 330
  " stroke="#FFD700" stroke-width="3" fill="none"/>

  <!-- 水纹 -->
  <path d="
    M110 350 C150 360, 270 360, 310 350
    M120 365 C160 375, 260 375, 300 365
  " stroke="#FFD700" stroke-width="2" fill="none"/>

</svg>
