<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>观音</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%; background:#000; overflow:hidden;
      display:flex; justify-content:center; align-items:center;
    }
    #stars {
      position:fixed; top:0; left:0; width:100%; height:100%;
      pointer-events:none; z-index:0;
    }
    .container {
      position:relative; width:100%; height:100%;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center; z-index:1;
    }

    /* ========== 竖屏（默认） ========== */
    .guanyin-wrapper {
      position:relative;
      width: min(83vw, 414px);
      animation: float 6s ease-in-out infinite;
      z-index: 5;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .guanyin-wrapper img {
      width:100%; height:auto; display:block;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
      -webkit-touch-callout: none;
    }
    /* 透明遮罩，屏蔽右键/长按保存观音图 */
    .guanyin-protect {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* 观音头部右上方 ✨ → mp4 播放器 */
    .sparkle-link {
      position: absolute;
      top: 6%;
      right: 14%;
      z-index: 12;
      font-size: clamp(18px, 5.2vw, 28px);
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      filter: drop-shadow(0 0 6px rgba(255, 240, 200, 0.85));
      animation: sparklePulse 2.4s ease-in-out infinite;
      pointer-events: auto;
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      padding: 4px;
    }
    .sparkle-link:hover {
      filter: drop-shadow(0 0 10px rgba(255, 255, 220, 1));
      transform: scale(1.12);
    }
    .sparkle-link:active {
      transform: scale(0.95);
    }
    @keyframes sparklePulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .throne-area {
      position:relative;
      width: min(92vw, 480px);
      height: min(48vw, 250px);
      margin-top: -40px;
      display:flex; justify-content:center; align-items:flex-end;
      z-index: 2;
    }

    .mandala-arc {
      position:absolute;
      left:50%; bottom:0;
      width:100%; height:100%;
      transform: translateX(-50%);
      pointer-events:none;
      z-index:1;
    }

    .m1 { left: 0%;   width: 30%; height: 30%; bottom: -4%; z-index: 8; animation-duration: 72s; animation-direction: reverse; }
    .m2 { left: 11%;  width: 22%; height: 22%; bottom: 12%; z-index: 6; animation-duration: 55s; }
    .m3 { left: 23%;  width: 16%; height: 16%; bottom: 24%; z-index: 4; animation-duration: 80s; animation-direction: reverse; }
    .m4 { left: 33%;  width: 12%; height: 12%; bottom: 33%; z-index: 2; animation-duration: 48s; }
    .m5 { right: 33%; width: 12%; height: 12%; bottom: 33%; z-index: 2; animation-duration: 52s; animation-direction: reverse; }
    .m6 { right: 23%; width: 16%; height: 16%; bottom: 24%; z-index: 4; animation-duration: 75s; }
    .m7 { right: 11%; width: 22%; height: 22%; bottom: 12%; z-index: 6; animation-duration: 58s; animation-direction: reverse; }
    .m8 { right: 0%;  width: 30%; height: 30%; bottom: -4%; z-index: 8; animation-duration: 65s; }
    .m9 {
      left: 50%; width: 20%; height: 20%; bottom: 6%;
      z-index: 5;
      animation: mandalaSpinCenter 90s linear infinite;
      opacity: 0.75;
    }

    .lotus-wrapper {
      position:relative;
      width: min(48vw, 220px);
      z-index: 10;
      animation: throneFloat 7s ease-in-out infinite;
    }
    .lotus-wrapper > img {
      width:100%; height:auto; display:block;
      pointer-events:none; position:relative; z-index:2;
    }

    .hotspot {
      position:absolute; border-radius:50%; cursor:pointer; z-index:12;
      transition: transform 0.15s ease;
    }
    .hot-piano   { width:32%; height:32%; top:4%; left:4%; }
    .hot-zjiao   { width:32%; height:32%; top:4%; right:4%; }
    .hot-mahjong { width:32%; height:32%; bottom:6%; left:4%; }
    .hot-slot    { width:32%; height:32%; bottom:6%; right:4%; }
    .hot-lotus   { width:42%; height:48%; top:26%; left:29%; }
    .hotspot:active { transform: scale(0.93); }

    /* 横屏时的四个信息框（竖屏隐藏） */
    .landscape-boxes {
      display: none;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes throneFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes mandalaSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes mandalaSpinCenter {
      from { transform: translateX(-50%) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg); }
    }

    /* ========== 横屏 ========== */
    @media (orientation: landscape) {
      .container {
        /* ===== 响应式布局变量（统一约束方程） ===== */
        --pad-x: 1.5vw;
        --gap-x: 1.8vw;
        --gap-y: 1.8vh;
        /* 可用总宽 = 视口 - 左右内边距 - 观音两侧间隙 */
        --avail-w: calc(100vw - 2 * var(--pad-x) - 2 * var(--gap-x));
        /* 观音目标占比，再受高度与绝对上限约束 */
        --g-ratio: 0.48;
        --g-w: min(
          calc(var(--avail-w) * var(--g-ratio)),
          42.55vh,
          370px
        );
        /* 信息框宽度沿用原正方形边长，确保横向占位与左右间距不变。 */
        --side-w: calc((var(--avail-w) - var(--g-w)) / 2);
        --box: min(
          var(--side-w),
          calc((100vh - var(--gap-y) - 2vh) / 2),
          170px
        );
        /* 横屏信息框高度 = 原正方形边长的 75%。 */
        --box-h: calc(var(--box) * 0.75);

        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 0 var(--pad-x);
        height: 100%;
        max-height: 100vh;
        overflow: hidden;
        box-sizing: border-box;
      }

      /* 隐藏竖屏的宝座和菜单 */
      .throne-area {
        display: none !important;
      }

      /* 观音：由 --g-w 驱动，高度不超屏 */
      .guanyin-wrapper {
        width: var(--g-w);
        max-height: 92vh;
        order: 2;
        margin: 0 var(--gap-x);
        flex-shrink: 0;
      }
      .guanyin-wrapper img {
        max-height: 92vh;
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      .sparkle-link {
        top: 5%;
        right: 12%;
        font-size: clamp(16px, 3.2vh, 26px);
      }

      /* 左右信息栏 */
      .landscape-boxes {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--gap-y);
        flex-shrink: 0;
        max-height: 96vh;
        width: var(--box);
      }
      .landscape-boxes.left {
        order: 1;
      }
      .landscape-boxes.right {
        order: 3;
      }

      /* 横屏信息框：宽度沿用原正方形边长，高度缩为原来的 75%。 */
      .info-box {
        width: var(--box);
        height: var(--box-h);
        aspect-ratio: auto;
        border: 1px solid rgba(218, 175, 80, 0.45);
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--box) * 0.055);
        cursor: pointer;
        transition: border-color 0.3s, box-shadow 0.3s, transform 0.15s, background 0.3s;
        text-align: center;
        box-shadow: none;
        overflow: hidden;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      .info-box:hover {
        border-color: rgba(255, 210, 120, 0.7);
        background: rgba(255, 200, 100, 0.04);
        box-shadow: 0 0 12px rgba(255, 200, 100, 0.1);
      }
      .info-box:active {
        transform: scale(0.97);
      }

      /* 字号仍按原信息框宽度缩放，避免因高度变化导致文字突然变小。 */
      .info-box p {
        font-size: clamp(10px, calc(var(--box) * 0.068), 12px);
        line-height: 1.42;
        font-weight: 400;
        letter-spacing: 0.02em;
        margin: 0;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
        max-width: 100%;
        word-break: break-word;
        overflow-wrap: break-word;
      }

      .info-box.piano p { color: #f5f5f5; }
      .info-box.zjiao p { color: #8fd9b0; }
      .info-box.mahjong p { color: #6eb8e8; }
      .info-box.slot p { color: #f7c4bf; }
    }

    /* 横屏且很矮（笔记本/部分平板）：再压一档，避免裁切 */
    @media (orientation: landscape) and (max-height: 420px) {
      .container {
        --g-w: min(
          calc(var(--avail-w) * 0.42),
          70vh,
          280px
        );
        --box: min(
          var(--side-w),
          calc((100vh - var(--gap-y) - 1vh) / 2),
          130px
        );
        /* --box-h 已在横屏基础规则中定义，这里只调整宽度约束与间距。 */
        --gap-y: 1.2vh;
        --gap-x: 1.2vw;
      }
    }
</style>
</head>

  <script>
    const audio = document.getElementById('bgm');
    function tryPlay() {
      audio.play().catch(() => {
        const r = () => audio.play();
        document.addEventListener('click', r, {once:true});
        document.addEventListener('touchstart', r, {once:true});
      });
    }
    function toggleMusic() { if (audio.paused) audio.play(); else audio.pause(); }
    // 统一外链入口：调用方只负责传入原 URL，地址本身不做任何改写。
    function openLink(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }
    if (document.readyState === 'complete') tryPlay();
    else window.addEventListener('load', tryPlay);

    /* ========== 观音图屏蔽拷贝 ========== */
    (function protectGuanyin() {
      // 禁止右键菜单（整页，重点保护观音区域）
      document.addEventListener('contextmenu', function (e) {
        if (e.target.closest('.guanyin-wrapper') || e.target.tagName === 'IMG') {
          e.preventDefault();
          return false;
        }
      }, true);

      // 禁止拖拽图片
      document.addEventListener('dragstart', function (e) {
        if (e.target.tagName === 'IMG' || e.target.closest('.guanyin-wrapper')) {
          e.preventDefault();
          return false;
        }
      }, true);

      // 禁止常见保存/复制快捷键（Ctrl/Cmd + S / C / U / P 等）
      document.addEventListener('keydown', function (e) {
        const key = (e.key || '').toLowerCase();
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && ['s', 'c', 'u', 'p', 'a'].includes(key)) {
          // 允许在输入框中复制，其余情况拦截
          if (!/^(INPUT|TEXTAREA)$/i.test(e.target.tagName) && !e.target.isContentEditable) {
            e.preventDefault();
            return false;
          }
        }
        // F12 / Ctrl+Shift+I 等开发者工具（轻度拦截，无法真正阻止）
        if (e.key === 'F12' || (ctrl && e.shiftKey && ['i', 'j', 'c'].includes(key))) {
          e.preventDefault();
          return false;
        }
      }, true);

      // 移动端长按提示拦截（配合 CSS touch-callout）
      document.addEventListener('touchstart', function (e) {
        if (e.target.closest('.guanyin-wrapper')) {
          // 不阻止触摸，只靠 CSS 与右键拦截
        }
      }, { passive: true });

      // 给观音图设置 draggable=false
      document.querySelectorAll('.guanyin-wrapper img').forEach(function (img) {
        img.setAttribute('draggable', 'false');
        img.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      });
    })();

    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars=[], meteors=[], w, h;
    const colors = ['255,255,255','200,220,255','180,200,255','255,240,220','255,230,180','220,200,255','180,240,255','255,210,210'];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      createStars();
    }
    function createStars() {
      const count = Math.floor((w*h)/1800);
      stars = [];
      for (let i=0;i<count;i++) {
        const size=Math.random();
        let radius,baseAlpha,twinkleSpeed;
        if(size<0.7){radius=Math.random()*1.1+0.3;baseAlpha=Math.random()*0.45+0.25;twinkleSpeed=Math.random()*0.025+0.008;}
        else if(size<0.92){radius=Math.random()*1.4+1;baseAlpha=Math.random()*0.4+0.4;twinkleSpeed=Math.random()*0.02+0.01;}
        else{radius=Math.random()*1.8+1.8;baseAlpha=Math.random()*0.3+0.55;twinkleSpeed=Math.random()*0.015+0.012;}
        stars.push({x:Math.random()*w,y:Math.random()*h,radius,color:colors[Math.floor(Math.random()*colors.length)],baseAlpha,twinkleSpeed,phase:Math.random()*Math.PI*2,deepTwinkle:Math.random()<0.45,hasSpike:Math.random()<0.07});
      }
    }
    function createMeteor() {
      const zone=Math.random()<0.55?0:1;
      let x,y,angle,speed;
      if(zone===0){x=Math.random()*w*0.85;y=-30-Math.random()*40;angle=Math.PI/5+(Math.random()-0.5)*0.4;speed=Math.random()*5+7;}
      else{x=-40+Math.random()*(w*0.3);y=h*0.78+Math.random()*(h*0.2);angle=Math.PI/6+(Math.random()-0.3)*0.35;speed=Math.random()*5+6.5;}
      meteors.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,len:Math.random()*70+50,alpha:1,life:1,decay:Math.random()*0.009+0.007,color:Math.random()>0.7?'255,230,180':'220,235,255',zone});
    }
    function drawStars() {
      ctx.clearRect(0,0,w,h);
      for(const s of stars){
        s.phase+=s.twinkleSpeed;
        let twinkle=s.deepTwinkle?Math.pow(0.5+0.5*Math.sin(s.phase),2.2):Math.max(0.05,0.35+0.65*Math.sin(s.phase));
        const alpha=s.baseAlpha*twinkle;
        if(alpha<0.03)continue;
        ctx.beginPath();ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
        ctx.fillStyle=`rgba(${s.color},${alpha})`;ctx.fill();
        if(s.radius>1.6&&alpha>0.3){ctx.beginPath();ctx.arc(s.x,s.y,s.radius*2,0,Math.PI*2);ctx.fillStyle=`rgba(${s.color},${alpha*0.12})`;ctx.fill();}
        if(s.hasSpike&&alpha>0.55){const len=s.radius*3.2;ctx.strokeStyle=`rgba(${s.color},${alpha*0.3})`;ctx.lineWidth=0.55;ctx.beginPath();ctx.moveTo(s.x-len,s.y);ctx.lineTo(s.x+len,s.y);ctx.moveTo(s.x,s.y-len);ctx.lineTo(s.x,s.y+len);ctx.stroke();}
      }
      for(let i=meteors.length-1;i>=0;i--){
        const m=meteors[i];
        m.x+=m.vx;m.y+=m.vy;m.life-=m.decay;m.alpha=Math.max(0,m.life);
        if(m.zone===0&&m.y>h*0.18+30)m.life-=0.04;
        if(m.zone===1&&m.y<h*0.78-20)m.life-=0.04;
        if(m.life<=0||m.x>w+120||m.y>h+80||m.y<-80){meteors.splice(i,1);continue;}
        const tx=m.x-m.vx*(m.len/12),ty=m.y-m.vy*(m.len/12);
        const g=ctx.createLinearGradient(m.x,m.y,tx,ty);
        g.addColorStop(0,`rgba(${m.color},${m.alpha})`);
        g.addColorStop(0.3,`rgba(${m.color},${m.alpha*0.45})`);
        g.addColorStop(1,`rgba(${m.color},0)`);
        ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);
        ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
        ctx.beginPath();ctx.arc(m.x,m.y,1.6,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${m.alpha})`;ctx.fill();
      }
      if(Math.random()<0.004)createMeteor();
      requestAnimationFrame(drawStars);
    }
    // 尺寸变化与横竖屏旋转都重新计算画布；CSS 的 orientation 媒体查询负责布局切换。
    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('orientationchange', resize, { passive: true });

    resize();
    drawStars();
  </script>
</body>
</html>
